cache_dir: .tmp

builder:
  output_dir: dist
  filter_list:
    - filename: adblockid.adfl.txt
      header: |
        [Adblock Plus 2.0]
        ! Title: AdBlockID Ultimate
        ! Description: Filter list that specifically removes adverts on Indonesian language websites.
        ! Last modified: %timestamp%
        ! Expires: 1 days
        ! Homepage: https://github.com/realodix/AdBlockID
        ! License: https://github.com/realodix/AdBlockID/blob/main/LICENSE
      source:
        - https://cdn.jsdelivr.net/gh/realodix/AdBlockID@master/dist/adblockid.adfl.txt
        - https://cdn.jsdelivr.net/gh/realodix/AdBlockID@master/dist/adblockid_plus.adfl.txt
        - https://cdn.jsdelivr.net/gh/realodix/AdBlockID@master/dist/annoyance.txt
    - filename: safesearch.txt
      header: |
        ---
        name: AdBlockID Addons (Safesearch)
        description: A filter that blocks spam, misleading, and malicious websites from appearing in search results!
        homepage: https://github.com/realodix/AdBlockID
        ---
      source:
        - https://cdn.jsdelivr.net/gh/realodix/AdBlockID@master/dist/safesearch.txt
        - https://cdn.jsdelivr.net/gh/realodix/AdBlockID@master/dist/safesearch_plus.txt
